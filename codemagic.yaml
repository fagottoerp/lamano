workflows:
  ios-free-build:
    name: iOS Build (No Signing)
    max_build_duration: 60
    environment:
      flutter: 3.44.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Sync iOS version from pubspec.yaml
        script: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f2)
          echo "Syncing iOS version: $VERSION build $BUILD"
          sed -i "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD;/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i "s/MARKETING_VERSION = [0-9.]*/MARKETING_VERSION = $VERSION/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Clean and Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod cache clean --all
          pod install --repo-update
          cd ..

      - name: Build iOS (no code signing)
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r lamano.ipa Payload/

    artifacts:
      - build/ios/iphoneos/lamano.ipa

    publishing:
      email:
        recipients:
          - fagottoerp@gmail.com
        notify:
          success: true
          failure: true
